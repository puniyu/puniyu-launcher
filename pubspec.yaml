name: puniyu_launcher
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  material_ui: 1.1.0
  shadcn_ui: ^0.56.1

  # 状态管理
  provider: ^6.1.2

  # 路由
  auto_route: ^11.1.0

  # 窗口管理
  # nativeapi: ^0.1.4
  window_manager: ^0.5.2

  # 本地化
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  rename_app: ^1.6.6
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.0

flutter:
  uses-material-design: false
  generate: true
  assets:
    - assets/icons/icon.png

  fonts:
    - family: DouyinSans
      fonts:
        - asset: assets/fonts/DouyinSans.otf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true
    icon_size: 48

config_name:
  name: "puniyu-launcher"
